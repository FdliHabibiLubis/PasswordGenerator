<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PassForge — Secure Password Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --fire-1: #ff4500;
      --fire-2: #ff6a00;
      --fire-3: #ee0979;
      --bg-deep: #0a0a0f;
      --bg-card: rgba(18, 18, 28, 0.82);
      --bg-input: rgba(255,255,255,0.04);
      --border-subtle: rgba(255,255,255,0.08);
      --border-glow: rgba(255, 100, 30, 0.45);
      --text-primary: #f0ede8;
      --text-muted: #7a7a8c;
      --text-accent: #ff6a00;
      --radius-card: 28px;
      --radius-input: 14px;
      --shadow-card: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
      --shadow-glow: 0 0 0 3px rgba(255, 106, 0, 0.25), 0 0 24px rgba(255, 69, 0, 0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      font-family: 'Syne', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* ── BACKGROUND ── */
    .bg-scene {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(238,9,121,0.12) 0%, transparent 60%),
                  radial-gradient(ellipse 70% 50% at 80% 90%, rgba(255,69,0,0.14) 0%, transparent 55%),
                  radial-gradient(ellipse 60% 40% at 50% 50%, rgba(255,106,0,0.06) 0%, transparent 70%),
                  linear-gradient(160deg, #0a0a0f 0%, #0f0b16 50%, #0a0d0f 100%);
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; opacity: 0.025;
      background-image:
        linear-gradient(rgba(255,106,0,0.6) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,106,0,0.6) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(90px); z-index: 0; pointer-events: none;
    }
    .bg-orb-1 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(255,69,0,0.18), transparent 70%); top: -80px; right: -100px; }
    .bg-orb-2 { width: 340px; height: 340px; background: radial-gradient(circle, rgba(238,9,121,0.14), transparent 70%); bottom: -60px; left: -80px; }

    /* ── LAYOUT ── */
    .page-wrap {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem 1rem;
    }

    /* ── BADGE ── */
    .top-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,106,0,0.1);
      border: 1px solid rgba(255,106,0,0.25);
      border-radius: 100px;
      padding: 5px 14px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-accent);
      margin-bottom: 1.5rem;
      animation: fadeDown 0.5s ease both;
    }
    .badge-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--fire-1);
      box-shadow: 0 0 6px var(--fire-1);
      animation: pulse 2s ease infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(0.8)} }

    /* ── CARD ── */
    .forge-card {
      width: 100%; max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      padding: 2.5rem 2.25rem 2.25rem;
      animation: fadeUp 0.6s cubic-bezier(.22,.9,.36,1) both 0.1s;
      transition: box-shadow 0.4s ease;
    }
    .forge-card:hover {
      box-shadow: var(--shadow-card), 0 0 60px rgba(255,69,0,0.07);
    }

    /* ── HEADER ── */
    .card-header-custom {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeDown 0.5s ease both 0.2s;
    }
    .lock-icon-wrap {
      display: inline-flex; align-items: center; justify-content: center;
      width: 58px; height: 58px; border-radius: 18px;
      background: linear-gradient(135deg, var(--fire-1), var(--fire-2));
      box-shadow: 0 8px 24px rgba(255,69,0,0.4), 0 0 0 1px rgba(255,255,255,0.1) inset;
      margin-bottom: 1rem;
      font-size: 1.6rem; color: #fff;
    }
    .card-title-main {
      font-size: 1.85rem; font-weight: 800; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 30%, var(--fire-2) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1; margin-bottom: 0.4rem;
    }
    .card-subtitle-text {
      font-size: 0.83rem; color: var(--text-muted); font-weight: 400; letter-spacing: 0.01em;
    }

    /* ── DIVIDER ── */
    .fancy-divider {
      height: 1px; background: linear-gradient(90deg, transparent, var(--border-subtle) 30%, var(--border-subtle) 70%, transparent);
      margin-bottom: 1.75rem;
    }

    /* ── FORM LABEL ── */
    .field-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.74rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 0.55rem;
    }
    .field-label i { font-size: 0.85rem; color: var(--text-accent); }

    /* ── INPUT ── */
    .forge-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-input);
      padding: 0.85rem 1.1rem;
      font-family: 'DM Mono', monospace;
      font-size: 1rem; color: var(--text-primary);
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      outline: none;
      -moz-appearance: textfield;
    }
    .forge-input::-webkit-outer-spin-button,
    .forge-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .forge-input::placeholder { color: rgba(255,255,255,0.2); }
    .forge-input:focus {
      background: rgba(255,255,255,0.06);
      border-color: var(--fire-2);
      box-shadow: var(--shadow-glow);
    }

    /* ── PASSWORD BOX ── */
    .password-box {
      position: relative;
    }
    .password-box .forge-input {
      padding-right: 6rem;
      letter-spacing: 0.08em;
      font-size: 0.97rem;
    }
    .pw-actions {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      display: flex; gap: 4px;
    }
    .pw-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 9px;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      font-size: 0.9rem; cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .pw-btn:hover { background: rgba(255,106,0,0.15); color: var(--fire-2); border-color: rgba(255,106,0,0.3); }
    .pw-btn.copied { background: rgba(34,197,94,0.15); color: #4ade80; border-color: rgba(34,197,94,0.35); }

    /* ── STRENGTH BAR ── */
    .strength-wrap { margin-top: 0.65rem; }
    .strength-bars { display: flex; gap: 5px; }
    .strength-bar {
      flex: 1; height: 4px; border-radius: 99px;
      background: rgba(255,255,255,0.07);
      transition: background 0.35s ease;
    }
    .strength-bar.active-weak   { background: #ef4444; }
    .strength-bar.active-fair   { background: #f97316; }
    .strength-bar.active-good   { background: #eab308; }
    .strength-bar.active-strong { background: #22c55e; }
    .strength-label {
      font-size: 0.68rem; color: var(--text-muted); margin-top: 0.3rem;
      letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600;
      text-align: right;
    }

    /* ── BUTTONS ── */
    .btn-generate {
      width: 100%; padding: 0.9rem;
      border-radius: var(--radius-input);
      border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--fire-3) 0%, var(--fire-1) 45%, var(--fire-2) 100%);
      background-size: 200% 200%; background-position: 0% 50%;
      color: #fff; font-family: 'Syne', sans-serif;
      font-size: 0.95rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      box-shadow: 0 6px 24px rgba(255,69,0,0.35), 0 0 0 1px rgba(255,255,255,0.07) inset;
      transition: background-position 0.5s ease, transform 0.2s ease, box-shadow 0.3s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-generate:hover {
      background-position: 100% 50%;
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(255,69,0,0.45), 0 0 0 1px rgba(255,255,255,0.1) inset;
    }
    .btn-generate:active { transform: translateY(0); }
    .btn-generate.generating { pointer-events: none; }
    .btn-generate .spin { animation: spin 0.6s linear infinite; display: none; }
    .btn-generate.generating .spin { display: inline-block; }
    .btn-generate.generating .btn-label { display: none; }

    .btn-save {
      width: 100%; padding: 0.85rem;
      border-radius: var(--radius-input);
      border: 1px solid rgba(255,106,0,0.3);
      background: rgba(255,106,0,0.06);
      color: var(--fire-2); font-family: 'Syne', sans-serif;
      font-size: 0.95rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s, transform 0.2s, box-shadow 0.25s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      text-decoration: none;
    }
    .btn-save:hover {
      background: rgba(255,106,0,0.12);
      border-color: rgba(255,106,0,0.5);
      box-shadow: 0 0 20px rgba(255,106,0,0.12);
      transform: translateY(-1px);
      color: var(--fire-2);
    }
    .btn-save:active { transform: translateY(0); }

    /* ── TOAST ── */
    .toast-bar {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(18,18,28,0.95); border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      color: var(--text-primary); padding: 10px 20px;
      border-radius: 100px; font-size: 0.82rem; font-weight: 600;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: flex; align-items: center; gap: 8px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1000; white-space: nowrap;
    }
    .toast-bar.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-bar i { color: #4ade80; }
    .toast-bar.warn i { color: #fb923c; }

    /* ── FOOTER ── */
    .card-footer-hint {
      text-align: center; margin-top: 1.5rem;
      font-size: 0.72rem; color: rgba(255,255,255,0.15); letter-spacing: 0.04em;
    }
    .card-footer-hint i { color: var(--fire-1); font-size: 0.65rem; }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp   { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeDown { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin     { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    .field-group { margin-bottom: 1.25rem; animation: fadeUp 0.5s ease both; }
    .field-group:nth-child(1) { animation-delay: 0.25s; }
    .field-group:nth-child(2) { animation-delay: 0.35s; }
    .field-group:nth-child(3) { animation-delay: 0.45s; }
    .field-group:nth-child(4) { animation-delay: 0.55s; }

    /* ── RESPONSIVE ── */
    @media (max-width: 520px) {
      .forge-card { padding: 2rem 1.4rem 1.75rem; }
      .card-title-main { font-size: 1.5rem; }
    }
  </style>
</head>

<body>
  <div class="bg-scene"></div>
  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="page-wrap">

    <!-- Badge -->
    <div class="top-badge">
      <span class="badge-dot"></span>
      Secure &amp; Private
    </div>

    <!-- Card -->
    <div class="forge-card">

      <!-- Header -->
      <div class="card-header-custom">
        <div class="lock-icon-wrap">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1 class="card-title-main">PassForge</h1>
        <p class="card-subtitle-text">Generate secure passwords instantly</p>
      </div>

      <div class="fancy-divider"></div>

      <!-- Length Input -->
      <div class="field-group">
        <label class="field-label" for="passwordLength">
          <i class="bi bi-sliders2-vertical"></i> Password Length
        </label>
        <input
          type="number"
          class="forge-input"
          id="passwordLength"
          placeholder="e.g. 16"
          min="4" max="128"
        />
      </div>

      <!-- Password Output -->
      <div class="field-group">
        <label class="field-label" for="password">
          <i class="bi bi-key-fill"></i> Generated Password
        </label>
        <div class="password-box">
          <input
            type="password"
            class="forge-input"
            id="password"
            placeholder="Your password will appear here"
            readonly
          />
          <div class="pw-actions">
            <button class="pw-btn" id="toggleBtn" title="Show / Hide" onclick="toggleVisibility()">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
            <button class="pw-btn" id="copyBtn" title="Copy" onclick="copyPassword()">
              <i class="bi bi-copy" id="copyIcon"></i>
            </button>
          </div>
        </div>
        <!-- Strength Bar -->
        <div class="strength-wrap" id="strengthWrap" style="display:none;">
          <div class="strength-bars">
            <div class="strength-bar" id="bar1"></div>
            <div class="strength-bar" id="bar2"></div>
            <div class="strength-bar" id="bar3"></div>
            <div class="strength-bar" id="bar4"></div>
          </div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>
      </div>

      <!-- Generate Button -->
      <div class="field-group">
        <button class="btn-generate" id="generateBtn" onclick="getPassword()">
          <i class="bi bi-arrow-repeat spin"></i>
          <span class="btn-label"><i class="bi bi-lightning-charge-fill"></i>&nbsp; Generate Password</span>
        </button>
      </div>

      <!-- Save Button -->
      <div class="field-group" style="margin-bottom:0;">
        <a class="btn-save" id="saveButton" onclick="savePassword()">
          <i class="bi bi-floppy-fill"></i> Save Password
        </a>
      </div>

      <!-- Footer hint -->
      <p class="card-footer-hint">
        <i class="bi bi-circle-fill"></i> Passwords are generated locally. Nothing is transmitted.
      </p>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-bar" id="toast">
    <i class="bi bi-check-circle-fill"></i>
    <span id="toastMsg">Done!</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js">
  </script>
</body>
</html>
