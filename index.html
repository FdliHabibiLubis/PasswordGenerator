<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password generator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body style="background-color: #e35336">

    
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="card shadow p-3" style="border-radius: 16px; height: 480px">
        <div
          class="d-flex justify-content-center align-items-center flex-column "
        >
          <h1 class="m-auto mt-2">Password generator</h1>
          <div class="d-flex flex-column gap-3 mt-3">
            <label for="passwordLength" class="text-uppercase fw-bold"
              >Panjang password</label
            >
            <input
              type="number"
              class="form-control form-control-lg"
              id="passwordLength"
              placeholder="Panjang password"
            />
            <label for="password" class="text-uppercase fw-bold"
              >Password</label
            >
            <input
              type="password"
              disabled
              class="form-control form-control-lg"
              id="password"
            />
            <button
              onclick="getPassword()"
              class="btn btn-outline-warning shadow text-uppercase btn-lg mt-2"
            >
              Genrated password
            </button>
            <a
              onclick="savePassword()"
              class="btn btn-outline-warning shadow text-uppercase btn-lg mt-2"
              id="saveButton"
            >
              Save password
            </a>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
